name: Actualizar precios y publicar

on:
  schedule:
    - cron: "40 20 * * *"        # todos los días 17:40 hora de Argentina (SEPA publica ~16:20)
  workflow_dispatch:              # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar el motor de cálculo y la agrupación de productos
        run: |
          node tests/motor.test.mjs
          python tests/tipos_test.py
          python pipeline/tiendas/promo_parser.py

      - name: Bajar SEPA y generar datos por zona
        env:
          # datos.produccion.gob.ar bloquea a los servidores de GitHub: el script usa entonces la copia
          # diaria del espejo público de preciazo. Opcional: un proxy argentino en
          # Settings → Secrets → Actions → SEPA_PROXY (ej. http://usuario:clave@host:puerto) para bajar del sitio oficial.
          HTTPS_PROXY: ${{ secrets.SEPA_PROXY }}
        run: |
          command -v zstd || (sudo apt-get update -q && sudo apt-get install -y -q zstd)
          python pipeline/build_tiles.py --salida public/data

      - name: Fotos, enlaces y promos de las tiendas online (si ya corrió "Tiendas online")
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download tiendas -p tiendas-web.tar.gz -D /tmp --clobber && tar -xzf /tmp/tiendas-web.tar.gz -C public/data \
            && du -sh public/data/web || echo "todavía no hay datos de tiendas online"
          python - <<'EOF' || true
          import json, os, glob
          d = "public/data/web"
          if os.path.isdir(d):
              fs = glob.glob(d + "/*.json"); n = sum(len(json.load(open(f))) for f in fs)
              print(f"{len(fs)} partes, {n} productos con datos web")
              for ean in ("7790387013610", "7790387013498", "7790895000997"):
                  print(ean, json.dumps(json.load(open(f"{d}/{ean[-3:]}.json")).get(ean), ensure_ascii=False)[:900])
          EOF

      - name: Armar el sitio
        run: |
          cp -r app/* public/
          touch public/.nojekyll
          du -sh public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
