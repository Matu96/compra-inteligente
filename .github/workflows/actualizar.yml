name: Actualizar precios y publicar

on:
  schedule:
    - cron: "40 20 * * *"        # todos los días 17:40 hora de Argentina (SEPA publica ~16:20)
  workflow_dispatch:              # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar el motor de cálculo
        run: node tests/motor.test.mjs

      - name: Bajar SEPA y generar datos por zona
        env:
          # Si datos.produccion.gob.ar bloquea a los servidores de GitHub, cargá un proxy argentino
          # en Settings → Secrets → Actions → SEPA_PROXY (ej. http://usuario:clave@host:puerto).
          HTTPS_PROXY: ${{ secrets.SEPA_PROXY }}
        run: python pipeline/build_tiles.py --salida public/data

      - name: Armar el sitio
        run: |
          cp -r app/* public/
          touch public/.nojekyll
          du -sh public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
