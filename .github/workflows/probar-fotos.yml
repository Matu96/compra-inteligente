name: Probar fotos
on:
  workflow_dispatch:
    inputs:
      eans: { description: "EANs separados por coma", required: true }
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Open Food Facts (CORS y tamaños)
        run: |
          pip install pillow -q
          UA="CompraInteligente/1.0 (github.com/Matu96/compra-inteligente)"
          curl -sS -A "$UA" "https://world.openfoodfacts.org/api/v2/search?code=${{ inputs.eans }}&fields=code,image_front_url,image_front_small_url&page_size=100" > r.json
          python3 - <<'PY'
          import json, urllib.request, io
          from PIL import Image
          d = json.load(open("r.json"))
          for p in d.get("products", []):
              u = p.get("image_front_url") or ""
              if not u: continue
              req = urllib.request.Request(u, headers={"User-Agent": "CompraInteligente/1.0", "Origin": "https://matu96.github.io"})
              with urllib.request.urlopen(req) as r:
                  acao = r.headers.get("Access-Control-Allow-Origin"); data = r.read()
              im = Image.open(io.BytesIO(data)).convert("RGB"); w, h = im.size
              borde = [im.getpixel((x, y)) for x in range(0, w, max(1, w // 40)) for y in (0, h - 1)] + [im.getpixel((x, y)) for y in range(0, h, max(1, h // 40)) for x in (0, w - 1)]
              blanco = sum(1 for (r, g, b) in borde if min(r, g, b) > 235) / len(borde)
              print(p["code"], f"{w}x{h}", f"borde blanco {blanco:.0%}", "CORS:", acao, u[-40:])
          PY
