name: Probar fotos (Open Food Facts)
on:
  workflow_dispatch:
    inputs:
      eans: { description: "EANs separados por coma", required: true }
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar
        run: |
          UA="CompraInteligente/1.0 (github.com/Matu96/compra-inteligente)"
          echo "== búsqueda múltiple"; curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" "https://world.openfoodfacts.org/api/v2/search?code=${{ inputs.eans }}&fields=code,product_name,brands,image_front_small_url&page_size=100" | head -c 1500; echo
          echo "== de a uno"
          for e in $(echo "${{ inputs.eans }}" | tr ',' ' '); do
            curl -sS -A "$UA" "https://world.openfoodfacts.org/api/v2/product/$e.json?fields=code,product_name,brands,image_front_small_url" | head -c 300; echo; sleep 1
          done
          echo "== CORS"; curl -sS -A "$UA" -D - -o /dev/null -H "Origin: https://matu96.github.io" "https://world.openfoodfacts.org/api/v2/product/7790387013610.json?fields=code" | grep -i "access-control\|^HTTP"
