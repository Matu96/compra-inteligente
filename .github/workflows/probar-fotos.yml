name: Probar fotos
on:
  workflow_dispatch:
    inputs:
      eans: { description: "EANs separados por coma", required: true }
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Precios Claros
        run: |
          mkdir -p fotos
          for e in $(echo "${{ inputs.eans }}" | tr ',' ' '); do
            code=$(curl -sS -A "Mozilla/5.0" -o fotos/$e.jpg -w "%{http_code} %{content_type} %{size_download}" "https://imagenes.preciosclaros.gob.ar/productos/$e.jpg" || echo "fallo")
            echo "$e -> $code"
          done
          python3 -c "
          import glob
          from PIL import Image
          for f in sorted(glob.glob('fotos/*.jpg')):
              try: im=Image.open(f); print(f, im.size, im.mode)
              except Exception as e: print(f, 'no es imagen', e)" 2>/dev/null || pip install pillow -q && python3 -c "
          import glob
          from PIL import Image
          for f in sorted(glob.glob('fotos/*.jpg')):
              try: im=Image.open(f); print(f, im.size, im.mode)
              except Exception as e: print(f, 'no es imagen', e)"
      - uses: actions/upload-artifact@v4
        with: { name: fotos, path: fotos }
