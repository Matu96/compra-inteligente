name: Cobertura de fotos
on:
  workflow_dispatch:
    inputs:
      buscar: { description: "EAN o palabras (separar con |)", required: false, default: "" }
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -sSf -o catalogo.json https://matu96.github.io/compra-inteligente/data/catalogo.json
          gh release download tiendas -p productos.json.gz
          if [ -n "${{ inputs.buscar }}" ]; then IFS='|' read -ra Q <<< "${{ inputs.buscar }}"; python pipeline/tiendas/buscar.py catalogo.json productos.json.gz "${Q[@]}"; else python pipeline/tiendas/cobertura.py catalogo.json productos.json.gz; fi
